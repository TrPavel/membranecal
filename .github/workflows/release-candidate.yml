name: Release candidate validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extracted-replay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build exact allowlisted candidate
        shell: pwsh
        run: |
          python tools/package.py --output "$env:RUNNER_TEMP/assets"
          python tools/package.py --output "$env:RUNNER_TEMP/repeated"
          if ((Get-FileHash "$env:RUNNER_TEMP/assets/membranecal-0.2.0.zip").Hash -ne (Get-FileHash "$env:RUNNER_TEMP/repeated/membranecal-0.2.0.zip").Hash) { throw 'Nondeterministic archive' }
          Expand-Archive "$env:RUNNER_TEMP/assets/membranecal-0.2.0.zip" "$env:RUNNER_TEMP/extracted"
      - name: Fresh reviewer environment
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/reviewer"
          & "$env:RUNNER_TEMP/reviewer/Scripts/python" -m pip install --require-hashes -r "$env:RUNNER_TEMP/extracted/membranecal-0.2.0/publication/v0.2/code/numerical/environment/requirements.lock"
          & "$env:RUNNER_TEMP/reviewer/Scripts/python" -m pip install -r "$env:RUNNER_TEMP/extracted/membranecal-0.2.0/requirements-dev.txt"
      - name: Audit extracted archive and replay without external rescue
        shell: pwsh
        run: |
          $env:PYTHONPATH = ''
          Set-Location "$env:RUNNER_TEMP/extracted/membranecal-0.2.0"
          & "$env:RUNNER_TEMP/reviewer/Scripts/python" tools/verify.py --development --report "$env:RUNNER_TEMP/audit.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/reviewer/Scripts/python" -I tools/isolate.py . "$env:RUNNER_TEMP/replay" --mode full
          exit $LASTEXITCODE
      - name: Preserve candidate and validation evidence privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: membranecal-0.2.0-candidate
          path: |
            ${{ runner.temp }}/assets/*
            ${{ runner.temp }}/audit.json
            ${{ runner.temp }}/replay/replay_report.json
            ${{ runner.temp }}/replay/isolation_report.json
          if-no-files-found: error
