name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime and repository validators
        run: |
          python -m pip install --require-hashes -r publication/v0.2/code/numerical/environment/requirements.lock
          python -m pip install -r requirements-dev.txt
      - run: python -m ruff check tools tests
      - run: python -m ruff format --check tools tests
      - run: python -m pytest -q
      - run: python tools/verify.py --development
      - name: Guard baseline science
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/frozen_guard.py --base "$BASE_SHA"
      - name: Compact offline replay
        run: |
          unset PYTHONPATH
          python tools/replay.py --mode compact --output "$RUNNER_TEMP/compact"
